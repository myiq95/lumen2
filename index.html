그린쇼가 있는 곳은 코난이 사랑한 마을이었다. 안개가 자욱한 아침, 그는 오래된 편지를 손에 들고 서 있었다.
"여기서부터 시작이지." 그가 중얼거렸다.
마을 사람들은 그를 낯설게 바라보았지만, 그 눈빛에는 호기심이 가득했다.
-2-
편지의 비밀
편지에는 단 한 줄이 적혀 있었다. "그린쇼의 아방궁에서 기다리겠네."
그 문장을 읽는 순간, 바람이 문을 흔들었다.
"누가 이런 장난을…"
하지만 장난치고는 너무 정교했다. 잉크의 냄새, 종이의 결.
그는 아방궁으로 향하기로 했다.
● 그린쇼의 아방궁 ●
세 번째 장
비가 내렸다. 돌담을 따라 물이 흘렀다.
그곳에서 그는 오래된 문을 발견했다. 문에는 작은 글씨가 새겨져 있었다.
-3-
마지막 문
문을 열자, 따뜻한 빛이 새어 나왔다. 그리고 그곳에는 아무도 없었다. 오직 책 한 권만이 놓여 있었다.
그 책의 첫 장에는 이렇게 적혀 있었다. 읽는다는 건, 머무는 것.
